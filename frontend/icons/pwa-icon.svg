<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background for maskable -->
  <rect width="512" height="512" fill="#0f1419"/>

  <!-- UFO/Saucer design -->
  <g transform="translate(256, 256)">
    <!-- Top dome -->
    <ellipse cx="0" cy="-30" rx="60" ry="35" fill="#6eb3c4" opacity="0.8"/>
    <ellipse cx="0" cy="-30" rx="50" ry="28" fill="#8cc9d9"/>

    <!-- Dome highlight -->
    <ellipse cx="-10" cy="-35" rx="20" ry="12" fill="#ffffff" opacity="0.4"/>

    <!-- Main saucer body -->
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="#4a8fa0"/>
    <ellipse cx="0" cy="0" rx="140" ry="30" fill="#6eb3c4"/>

    <!-- Saucer rim -->
    <ellipse cx="0" cy="5" rx="150" ry="15" fill="#2c5a66"/>

    <!-- Light beam indicators -->
    <path d="M -80 15 L -100 80 L -60 80 Z" fill="#6ea87d" opacity="0.3"/>
    <path d="M -20 15 L -30 80 L -10 80 Z" fill="#6ea87d" opacity="0.3"/>
    <path d="M 20 15 L 10 80 L 30 80 Z" fill="#6ea87d" opacity="0.3"/>
    <path d="M 80 15 L 60 80 L 100 80 Z" fill="#6ea87d" opacity="0.3"/>

    <!-- Detail lines on saucer -->
    <ellipse cx="0" cy="-5" rx="120" ry="3" fill="#8cc9d9" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="100" ry="3" fill="#4a8fa0" opacity="0.5"/>

    <!-- Windows/lights on dome -->
    <circle cx="-25" cy="-25" r="6" fill="#ffd700" opacity="0.8"/>
    <circle cx="0" cy="-30" r="6" fill="#ffd700" opacity="0.8"/>
    <circle cx="25" cy="-25" r="6" fill="#ffd700" opacity="0.8"/>
  </g>

  <!-- "SKY" text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#6eb3c4" text-anchor="middle">SKY</text>
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#6ea87d" text-anchor="middle">REWIND</text>
</svg>
